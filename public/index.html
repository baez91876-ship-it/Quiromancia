<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiromancia API</title>
    <meta
      name="description"
      content="Panel de la Quiromancia API para crear, consultar y administrar lecturas numerológicas y prompts."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#120d1d" />
    <link rel="canonical" href="/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #120d1d;
        --bg-soft: #1b1328;
        --panel: rgba(30, 22, 42, 0.94);
        --panel-alt: rgba(39, 30, 58, 0.9);
        --primary: #d4af37;
        --text: #f7f2ff;
        --muted: #d4c6eb;
        --accent: #7c5cff;
        --danger: #ff6b6b;
        --success: #8de5a9;
        --border: rgba(212, 175, 55, 0.32);
        --field: rgba(10, 8, 14, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #261d39 0%, var(--bg) 45%, #0f0b17 100%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .app-shell {
        width: min(980px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      .eyebrow {
        display: inline-block;
        margin: 0 0 8px;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--primary);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.1rem);
        color: var(--primary);
      }

      h2 {
        margin: 0;
        color: var(--text);
        font-size: 1.45rem;
      }

      .intro {
        margin: 18px 0 0;
        color: var(--muted);
        line-height: 1.7;
        max-width: 780px;
      }

      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 22px 0 0;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 0.7rem 1rem;
        border-radius: 999px;
        background: rgba(124, 92, 255, 0.14);
        border: 1px solid rgba(124, 92, 255, 0.45);
        color: var(--text);
        font-size: 0.92rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin: 28px 0;
      }

      .button {
        appearance: none;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 44px;
        border-radius: 12px;
        border: 1px solid transparent;
        padding: 0.85rem 1.2rem;
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.2s ease, opacity 0.2s ease, border-color 0.2s ease;
        cursor: pointer;
      }

      .button:hover {
        transform: translateY(-1px);
        opacity: 0.98;
      }

      .button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .button.primary {
        background: var(--primary);
        color: #120d1d;
      }

      .button.secondary {
        background: transparent;
        border-color: var(--primary);
        color: var(--text);
      }

      .panel {
        background: var(--panel-alt);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 18px;
        padding: 18px;
        margin-top: 24px;
      }

      .panel-alt {
        margin-top: 28px;
      }

      .section-head {
        margin-bottom: 18px;
      }

      .lectura-form {
        display: grid;
        gap: 18px;
      }

      .field-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .field-row.single {
        grid-template-columns: 1fr;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      label span {
        font-weight: 600;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: var(--field);
        color: var(--text);
        border-radius: 10px;
        padding: 0.8rem 0.9rem;
      }

      textarea {
        min-height: 100px;
        resize: vertical;
      }

      .form-actions {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .form-message {
        min-height: 20px;
        color: var(--muted);
      }

      .form-message.success {
        color: var(--success);
      }

      .form-message.error {
        color: var(--danger);
      }

      .status {
        color: var(--muted);
        margin-bottom: 14px;
      }

      .lecturas-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
      }

      .lectura-item {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 14px 16px;
      }

      .lectura-item strong {
        display: block;
        color: var(--primary);
        margin-bottom: 5px;
      }

      .lectura-meta {
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.6;
      }

      .empty-state {
        color: var(--muted);
        padding: 12px 0;
      }

      @media (max-width: 700px) {
        .app-shell {
          padding: 20px 16px;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }

        .field-row {
          grid-template-columns: 1fr;
        }

        .actions,
        .form-actions {
          flex-direction: column;
          align-items: stretch;
        }

        .button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <span class="eyebrow">Dashboard</span>
          <h1>Quiromancia API</h1>
        </div>
        <button id="refreshLecturas" class="button primary" type="button">Actualizar lecturas</button>
      </header>

      <p class="intro">
        La aplicación está funcionando y permite consultar usuarios, prompts y lecturas
        generadas con apoyo de IA.
      </p>

      <div class="badges" aria-label="Tecnologías del proyecto">
        <span class="badge">Express</span>
        <span class="badge">MongoDB</span>
        <span class="badge">Node.js</span>
        <span class="badge">REST API</span>
      </div>

      <div class="actions">
        <a class="button primary" href="/api/v1/usuarios">Ver usuarios</a>
        <button id="btnLecturas" class="button secondary" type="button">Ver lecturas</button>
      </div>

      <section class="panel">
        <div class="section-head">
          <h2>Crear lectura</h2>
        </div>

        <form id="lecturaForm" class="lectura-form">
          <div class="field-row">
            <label>
              <span>Usuario</span>
              <select id="usuarioId" name="usuario_id" required></select>
            </label>

            <label>
              <span>Prompt</span>
              <select id="promptId" name="prompt_usado_id" required></select>
            </label>
          </div>

          <div class="field-row single">
            <label>
              <span>Respuesta</span>
              <textarea id="respuesta" name="respuesta" rows="3" required></textarea>
            </label>
          </div>

          <div class="field-row single">
            <label>
              <span>Análisis</span>
              <textarea id="analisis" name="analisis" rows="4" required></textarea>
            </label>
          </div>

          <div class="field-row single">
            <label>
              <span>Metadata (JSON)</span>
              <textarea id="metadata" name="metadata" rows="3"></textarea>
            </label>
          </div>

          <div class="field-row single">
            <label>
              <span>Resultado</span>
              <input id="resultado" name="resultado" type="text" required />
            </label>
          </div>

          <div class="form-actions">
            <button type="submit" class="button primary">Guardar lectura</button>
            <span id="formMessage" class="form-message" aria-live="polite"></span>
          </div>
        </form>
      </section>

      <section class="panel panel-alt">
        <div class="section-head">
          <h2>Lecturas recientes</h2>
        </div>
        <div id="lecturasStatus" class="status">Cargando lecturas...</div>
        <ul id="lecturasList" class="lecturas-list"></ul>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
